[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mower-perception"
version = "0.1.0"
description = "YOLOv8 obstacle detection and lawn segmentation for an autonomous lawn mower"
requires-python = ">=3.10"
dependencies = [
  "ultralytics>=8.0.0",
  "opencv-python-headless>=4.8.0",
  "numpy>=1.24.0",
  "pillow>=10.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
