odom_topic: /odometry/filtered
detections_topic: /camera/detections_json
enabled_topic: /mower/autonomy_enabled
cut_cycle_topic: /mower/cut_cycle_active
require_cut_cycle: true
cut_cycle_timeout_s: 1.0
motion_cmd_topic: /cmd_vel
motion_cmd_timeout_s: 0.6
min_cmd_linear_for_lookahead_mps: 0.02
camera_roi_grass_gate_enabled: true
camera_roi_image_topic: /camera/image_raw
camera_roi_timeout_s: 0.8
camera_roi_min_grass_ratio: 0.90
camera_roi_x_min_frac: 0.0
camera_roi_x_max_frac: 1.0
camera_roi_y_min_frac: 0.80
camera_roi_y_max_frac: 1.0
camera_roi_h_min: 30
camera_roi_h_max: 95
camera_roi_s_min: 35
camera_roi_s_max: 255
camera_roi_v_min: 30
camera_roi_v_max: 255
non_grass_snapshot_enabled: true
non_grass_snapshot_interval_s: 1.0
non_grass_snapshot_dir: ~/.ros/non_grass_snapshots
grass_hold_during_turn: true
grass_hold_turn_min_angular_rps: 0.35
grass_hold_turn_max_linear_mps: 0.10
grass_hold_max_s: 6.0

output_enabled_topic: /mower/cutter_enabled
output_reason_topic: /mower/cutter_reason
command_topic: /cutter_controller/command

lookahead_m: 0.8
blade_speed_on: 45.0
blade_speed_off: 0.0
command_cutter: true
disable_in_manual: false
fail_closed_if_no_detection: false
loop_hz: 20.0
