path_topic: /mower_ai/cut_plan
odom_topic: /odometry/filtered
cmd_topic: /cmd_vel_nav
enabled_topic: /mower/autonomy_enabled
max_linear_mps: 0.45
max_angular_rps: 1.0
kp_angular: 1.6
rotate_in_place_threshold_rad: 1.45
coverage_allow_in_place_turn: true
coverage_stop_turn_go: true
coverage_turn_enter_rad: 0.30
coverage_turn_exit_rad: 0.08
coverage_turn_min_angular_rps: 0.35
coverage_turn_burst_enabled: true
coverage_turn_burst_max_yaw_rad: 0.35
coverage_turn_burst_max_s: 1.2
coverage_turn_burst_cooldown_s: 0.45
coverage_turn_radius_m: 0.75
coverage_turn_speed_mps: 0.16
tf_timeout_s: 0.2
start_nearest_waypoint: false
reseed_on_new_path: false
min_linear_mps: 0.05
waypoint_tolerance_m: 0.15
goal_tolerance_m: 0.20
coverage_max_waypoint_advance: 1
odom_timeout_s: 0.6
loop_hz: 20.0
return_to_start: true

# Short obstacle-aware transfer plans:
#  - spawn -> first cut waypoint at start
#  - last cut waypoint -> spawn at finish
transfer_path_enabled: true
transfer_replan_interval_s: 2.0
transfer_waypoint_tolerance_m: 0.25
transfer_free_threshold: 20
transfer_unknown_is_blocked: true
transfer_clearance_m: 0.25
transfer_nearest_search_cells: 24
transfer_astar_max_expansions: 90000
transfer_use_line_simplify: true

# Phase 1 bootstrap: perimeter mapping before coverage path following.
perimeter_bootstrap_enabled: true
perimeter_repeat_each_enable: true
bootstrap_mode: random_explore
bootstrap_map_topic: /map
bootstrap_map_timeout_s: 6.0
bootstrap_min_known_cells: 1200
bootstrap_min_known_ratio: 0.10
bootstrap_min_duration_s: 40.0
bootstrap_max_duration_s: 220.0
bootstrap_min_travel_m: 16.0
bootstrap_reset_on_enable: true

# Random exploration bootstrap (used when bootstrap_mode=random_explore).
explore_forward_speed_mps: 0.28
explore_stop_distance_m: 1.70
explore_clear_distance_m: 2.20
explore_front_predict_time_s: 2.2
explore_reverse_speed_mps: 0.20
explore_reverse_duration_s: 0.8
explore_turn_rate_rps: 0.95
explore_turn_min_angle_rad: 1.25
explore_turn_max_angle_rad: 1.75
explore_turn_exit_rad: 0.09
explore_turn_timeout_s: 4.5
explore_block_votes: 2
explore_side_clearance_m: 0.70
explore_scanless_turn_rps: 0.45
explore_seed: 4499

# Legacy wall-follow bootstrap parameters (used when bootstrap_mode=perimeter_wall_follow).
perimeter_complete_topic: /mower/perimeter_complete
perimeter_scan_topic: /scan
perimeter_base_frame: base_footprint
perimeter_scan_timeout_s: 0.7
perimeter_sector_half_width_deg: 22.0
perimeter_sector_min_points: 2
perimeter_sector_distance_rank: 1
perimeter_self_filter_m: 0.2
perimeter_robot_half_length_m: 0.48
perimeter_robot_half_width_m: 0.30
perimeter_footprint_padding_m: 0.03
perimeter_min_duration_s: 35.0
perimeter_max_duration_s: 0.0
perimeter_timeout_min_progress_ratio: 0.75
perimeter_timeout_max_restarts: 2
perimeter_min_travel_m: 12.0
perimeter_min_extent_x_m: 4.0
perimeter_min_extent_y_m: 4.0
perimeter_far_distance_m: 1.5
perimeter_close_tolerance_m: 1.0
perimeter_forward_speed_mps: 0.24
perimeter_turn_rate_rps: 0.45
perimeter_right_turn_rate_rps: 0.6
perimeter_blind_turn_rps: 0.7
perimeter_front_stop_m: 2.35
perimeter_front_clear_m: 3.00
perimeter_front_predict_time_s: 4.5
perimeter_emergency_stop_m: 1.25
perimeter_emergency_stop_votes: 2
perimeter_corner_preturn_m: 4.40
perimeter_corner_commit_m: 3.40
perimeter_corner_min_linear_mps: 0.10
perimeter_corner_turn_angle_rad: 1.5708
perimeter_corner_turn_exit_rad: 0.08
perimeter_corner_turn_rate_rps: 0.6
perimeter_corner_turn_linear_mps: 0.00
perimeter_corner_turn_in_place: true
perimeter_corner_turn_max_s: 5.5
perimeter_corner_timeout_accept_rad: 0.30
perimeter_corner_backoff_s: 2.0
perimeter_corner_retry_cooldown_s: 1.8
perimeter_corner_backoff_speed_mps: 0.22
perimeter_corner_backoff_turn_rps: 0.55
perimeter_corner_retry_clearance_m: 2.90
perimeter_corner_trigger_count: 4
perimeter_right_target_m: 0.60
perimeter_right_open_m: 0.95
perimeter_right_close_m: 0.42
perimeter_right_acquire_m: 1.6
perimeter_seek_turn_rps: 0.0
perimeter_require_wall_contact: true
perimeter_wall_kp: 1.1
perimeter_wall_max_turn_rps: 0.65
perimeter_stall_window_s: 2.0
perimeter_stall_min_progress_m: 0.08
perimeter_turn_stall_min_yaw_rad: 0.14
perimeter_turn_stall_min_cmd_rps: 0.35
perimeter_front_block_reverse_speed_mps: 0.14
perimeter_front_turn_bias_m: 0.20
perimeter_escape_turn_s: 2.2
perimeter_escape_reverse_speed_mps: 0.18
perimeter_escape_reverse_only_s: 1.20
perimeter_escape_pivot_turn_s: 2.0
perimeter_escape_max_reverse_attempts: 4
perimeter_escape_pivot_turn_rps: 0.8
perimeter_drive_wheel_separation_m: 0.50
perimeter_reverse_turn_ratio: 0.45

# Global wheel-spin stall recovery (applies in perimeter and coverage).
motion_stuck_enabled: true
motion_stuck_window_s: 2.5
motion_stuck_min_progress_m: 0.03
motion_stuck_min_yaw_rad: 0.08
motion_stuck_min_cmd_linear_mps: 0.10
motion_stuck_min_cmd_angular_rps: 0.30
motion_stuck_min_wheel_rps: 0.45
motion_stuck_min_effective_ratio: 0.35
motion_stuck_use_ratio_checks: false
motion_stuck_trigger_count: 2
motion_stuck_linear_only_max_angular_rps: 0.25
motion_stuck_angular_only_max_linear_mps: 0.08
motion_stuck_escape_reverse_mps: 0.20
motion_stuck_escape_turn_rps: 1.00
motion_stuck_escape_duration_s: 1.8
motion_stuck_escape_reverse_only_s: 0.6
motion_stuck_keep_turn_direction: true
turn_effective_diag_enabled: true
turn_effective_min_cmd_angular_rps: 0.50
turn_effective_max_cmd_linear_mps: 0.06
turn_effective_max_odom_angular_rps: 0.15
turn_effective_max_wheel_delta_rps: 0.12
turn_effective_trigger_s: 0.9
forward_alignment_guard_enabled: true
forward_alignment_min_cmd_mps: 0.10
forward_alignment_reverse_detect_mps: 0.05
forward_alignment_min_turn_rps: 0.45

# Cut progress visualization in RViz (published on ~debug_markers).
cut_viz_enabled: true
cut_viz_blade_width_m: 0.50
cut_viz_alpha: 0.82
cut_viz_point_spacing_m: 0.04
cut_viz_max_link_m: 0.35
cut_viz_max_points: 250000
cut_viz_z_offset_m: 0.02
cut_viz_thickness_m: 0.01
cut_viz_width_samples: 9
cut_viz_require_cutter_enabled: true
cutter_enabled_topic: /mower/cutter_enabled
cut_cycle_topic: /mower/cut_cycle_active
cut_cycle_min_linear_mps: 0.08
cut_cycle_max_abs_angular_rps: 0.70
cut_cycle_max_target_dist_m: 1.20
debug_show_cmd_markers: false

# Launch-time debug acceleration controls.
debug_speed_scale: 1.0
debug_turn_scale: 1.0

# Optional ultrasonic assist for front-wall detection.
use_ultrasonic_front: true
ultrasonic_topic: /jetson_mega_bridge/ultrasonic_distance_cm
ultrasonic_scale: 0.01
ultrasonic_timeout_s: 0.6
